<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicios</title>
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1> Ejercicios de javascrip </h1>
    </header>

    <nav>
        <button id="btnSalud" onclick="abrirPestana('tabSalud', this)" class="active">Area de Salud</button>
        <button id="btnAstro" onclick="abrirPestana('tabAstro', this)">Area de asttronomia</button>
        <button id="btnAmbiente" onclick="abrirPestana('tabAmbiente', this)">Area de medio ambiente</button>
    </nav>

    <main>
        <div id="tabSalud" class="tab-content" style="display: block;">
            <h2>Area de Salud </h2>
            <div class="ejercicio">
                <h3>Clasificaion de presion arterial</h3>
                <div class="input-group">
                    <label for="sistolica">Sistolica (mmHg):</label><input type="number" id="sistolica" value="135">
                    <label for="diastolica">Diastolica (mmHg):</label><input type="number" id="diastolica" value="85">
                    <button onclick="salud_pa_clasificar()">Clasificar</button>
                </div>
                <div id="salud_res_pa" class="resultado"></div>
            </div>
            </div>

        <div id="tabAstro" class="tab-content">
            <h2>Area de Astronomia </h2>
            <div class="ejercicio">
                <h3>Clasificacion de brillo estelar</h3>
                <div class="input-group">
                    <label for="magnitud">Magnitud Aparente:</label><input type="number" id="magnitud" value="-1.5" step="0.1">
                    <button onclick="astro_brillo_clasificar()">Clasificar</button>
                </div>
                <div id="astro_res_brillo" class="resultado"></div>
            </div>
            </div>

        <div id="tabAmbiente" class="tab-content">
            <h2>Area de Medio Ambiente </h2>
            <div class="ejercicio">
                <h3>Clasificacion de calidad del aire </h3>
                <div class="input-group">
                    <label for="aqi">Valor AQI:</label><input type="number" id="aqi" value="65">
                    <button onclick="ambiente_aqi_clasificar()">Clasificar</button>
                </div>
                <div id="ambiente_res_aqi" class="resultado"></div>
            </div>
            </div>

    </main>

    <script src="js\scripts.js"></script>
</body>
</html>
